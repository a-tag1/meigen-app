<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>言葉のお守り箱 - Dark Edition</title>
  <style>
    :root {
      --bg-color: #0b0c10;          /* 漆黒に近いダークバック */
      --card-bg: #1f2833;           /* 控えめな深みのあるグレー */
      --text-main: #edf5e1;         /* 視認性の高いオフホワイト */
      --text-sub: #c5c6c7;          /* シックなシルバーグレー */
      --accent-color: #66fcf1;      /* 鮮やかなネオンターコイズ（差し色） */
      --border-color: #2c353f;      /* 質感のあるダークボーダー */
      --danger-color: #ff4d4d;      /* 落ち着いたレッド */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
    }    

    /* メインコンテナ */
    .app-container { 
      width: 100%; 
      max-width: 480px; 
      min-height: 100vh;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      padding: 24px; 
      position: relative; 
    }

    /* ヘッダー（ミニマルな設定アイコン） */
    header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .header-actions { display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-sub); padding: 8px; border-radius: 50%; transition: color 0.2s, transform 0.2s; }
    .icon-btn:hover { color: var(--accent-color); transform: rotate(30deg); }

    /* 名言カード表示エリア：枠線を無くして空間を活かしたかっこいいスタイル */
    .card-area { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: left; cursor: pointer; user-select: none; padding: 20px 0; }
    .quote-card { 
      background: rgba(255, 255, 255, 0.02); 
      width: 100%; 
      padding: 48px 28px; 
      border-radius: 20px; 
      border: 1px solid rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(10px); 
      display: flex; 
      flex-direction: column; 
      gap: 28px; 
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease; 
      position: relative; 
      max-height: max(200px, calc(100vh - 180px));
      min-height: 0;
      overflow: hidden;
      word-break: break-word;
    }
    .quote-card::before { content: "“"; position: absolute; top: 12px; left: 20px; font-size: 4rem; color: rgba(255, 255, 255, 0.05); font-family: Georgia, serif; line-height: 1; }
    .quote-card:active { transform: scale(0.98); }
    .quote-text { min-height: 0; overflow-y: auto; font-size: 1.35rem; font-weight: 300; line-height: 1.7; letter-spacing: 0.04em; color: var(--text-main); text-shadow: 0 0 20px rgba(255,255,255,0.05); }
    .quote-text .tate-chu-yoko { text-combine-upright: all; }
    .playlist-membership { width: 100%; margin-bottom: 12px; color: var(--text-sub); font-size: 0.8rem; letter-spacing: 0.06em; text-align: center; }
    .playlist-membership[hidden] { display: none; }
    .quote-author { flex-shrink: 0; font-size: 0.85rem; color: var(--accent-color); text-align: right; letter-spacing: 0.1em; text-transform: uppercase; }
    .quote-card.is-vertical { height: min(65vh, 560px); flex-direction: row-reverse; align-items: stretch; }
    .quote-card.is-vertical .quote-text { flex: 0 1 auto; width: fit-content; max-width: 100%; height: 100%; margin-left: auto; margin-right: auto; writing-mode: vertical-rl; text-orientation: mixed; white-space: pre-wrap; overflow-x: auto; overflow-y: hidden; }
    .quote-card.is-vertical .quote-author { writing-mode: vertical-rl; align-self: flex-end; text-align: left; }
    .tap-hint { font-size: 0.7rem; color: var(--text-sub); margin-top: 24px; opacity: 0.4; letter-spacing: 0.15em; text-transform: uppercase; }

    /* モーダル：ダークグラスモーフィズム */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); justify-content: center; align-items: flex-end; z-index: 100; opacity: 0; transition: opacity 0.25s ease; }
    .modal.show { display: flex; opacity: 1; }
    .modal-content { background: var(--bg-color); width: 100%; max-width: 480px; max-height: 85vh; border-radius: 24px 24px 0 0; border-top: 1px solid var(--border-color); padding: 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal.show .modal-content { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
    .modal-title { font-size: 1rem; font-weight: 600; letter-spacing: 0.08em; color: var(--text-main); }

    /* メニューリスト */
    .menu-list { list-style: none; display: flex; flex-direction: column; }
    .menu-item { padding: 18px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; color: var(--text-sub); transition: color 0.2s; }
    .menu-item:hover, .menu-item:active { color: var(--accent-color); }
    .menu-item:last-child { border-bottom: none; }

    /* フォーム・ボタン */
    .form-group { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.75rem; color: var(--text-sub); letter-spacing: 0.1em; text-transform: uppercase; }
    textarea, input { width: 100%; padding: 14px; background: #15181e; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; color: var(--text-main); outline: none; transition: border-color 0.2s; }
    textarea:focus, input:focus { border-color: var(--accent-color); }
    textarea { height: 110px; resize: none; }
    
    .primary-btn { background: var(--accent-color); color: #000; border: none; padding: 16px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; font-weight: 700; width: 100%; letter-spacing: 0.1em; text-transform: uppercase; transition: opacity 0.2s; }
    .primary-btn:active { opacity: 0.8; }
    .secondary-btn { background: transparent; color: var(--text-main); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; width: 100%; transition: border-color 0.2s; }
    .secondary-btn:active { border-color: var(--accent-color); }

    /* 一覧・データ管理 */
    .quote-list { display: flex; flex-direction: column; gap: 12px; }
    .list-item { background: #15181e; padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .list-item-text { font-size: 0.9rem; line-height: 1.5; color: var(--text-main); }
    .list-item-author { font-size: 0.75rem; color: var(--accent-color); margin-top: 6px; }
    .delete-btn { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 0.8rem; padding: 4px; opacity: 0.7; }
    .delete-btn:hover { opacity: 1; }
    .edit-btn { background: none; border: none; color: var(--accent-color); cursor: pointer; font-size: 0.8rem; padding: 4px; opacity: 0.7; }
    .edit-btn:hover { opacity: 1; }
    .search-input { margin-bottom: 4px; }

    /* 文字サイズ選択ボタングループ */
    .size-selector { display: flex; gap: 8px; }
    .size-btn { flex: 1; background: #15181e; color: var(--text-sub); border: 1px solid var(--border-color); padding: 12px 8px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-align: center; }
    .size-btn.active { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 700; }
    .font-size-control { display: flex; align-items: center; gap: 14px; }
    .font-size-control input[type="range"] { flex: 1; min-width: 0; padding: 0; background: transparent; border: 0; border-radius: 0; accent-color: var(--accent-color); }
    .font-size-value { min-width: 3.5em; color: var(--text-main); text-align: right; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
    .playlist-choice-btn.is-selected { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: 700; }
    .home-actions { display: flex; justify-content: center; gap: 18px; padding: 12px 0; }
    .home-actions .icon-btn { border: 1px solid var(--border-color); width: 46px; height: 46px; font-size: 22px; }
    .home-actions .icon-btn:disabled { opacity: 0.3; cursor: default; }
    .exit-fullscreen-btn { display: none; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.2s ease, visibility 0.2s ease; }
    .app-container:fullscreen, .app-container.is-fullscreen { position: fixed; inset: 0; z-index: 1000; width: 100%; max-width: none; height: 100vh; min-height: 100vh; background: var(--bg-color); }
    .app-container:fullscreen .home-actions, .app-container.is-fullscreen .home-actions { display: none; }
    .app-container:fullscreen #openPlaylistsBtn, .app-container:fullscreen #openMenuBtn, .app-container:fullscreen #fullscreenBtn,
    .app-container.is-fullscreen #openPlaylistsBtn, .app-container.is-fullscreen #openMenuBtn, .app-container.is-fullscreen #fullscreenBtn { display: none; }
    .app-container:fullscreen .exit-fullscreen-btn, .app-container.is-fullscreen .exit-fullscreen-btn { display: block; }
    .app-container:fullscreen.show-fullscreen-controls .exit-fullscreen-btn, .app-container.is-fullscreen.show-fullscreen-controls .exit-fullscreen-btn { opacity: 0.55; visibility: visible; pointer-events: auto; }
    .app-container:fullscreen.show-fullscreen-controls .exit-fullscreen-btn:hover, .app-container:fullscreen.show-fullscreen-controls .exit-fullscreen-btn:focus-visible,
    .app-container.is-fullscreen.show-fullscreen-controls .exit-fullscreen-btn:hover, .app-container.is-fullscreen.show-fullscreen-controls .exit-fullscreen-btn:focus-visible { opacity: 1; }
    .quote-theme { flex-shrink: 0; color: var(--text-sub); font-size: 0.72rem; text-align: right; letter-spacing: 0.08em; }
    .screen { display: none; width: 100%; min-height: 100vh; padding: 24px; }
    .screen.active { display: block; }
    .screen-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .screen-header h1 { flex: 1; font-size: 1.1rem; font-weight: 600; }
    .playlist-playback-title { display: none; margin-right: auto; padding: 8px 0; border: 0; background: none; color: var(--text-main); font-size: 0.9rem; text-align: left; cursor: pointer; }
    .playlist-playback-title.is-visible { display: block; }
    .playlist-list { display: flex; flex-direction: column; gap: 10px; }
    .playlist-row { display: flex; align-items: center; gap: 12px; padding: 16px; background: #15181e; border: 1px solid var(--border-color); border-radius: 10px; }
    .playlist-open { flex: 1; min-width: 0; background: none; border: 0; color: var(--text-main); text-align: left; cursor: pointer; }
    .playlist-name { display: block; font-size: 0.95rem; }
    .playlist-count { display: block; margin-top: 5px; color: var(--text-sub); font-size: 0.75rem; }
    .playlist-controls { display: flex; align-items: center; gap: 8px; }
    .playlist-detail { display: flex; flex-direction: column; gap: 14px; }
    .playlist-player { padding: 22px 18px; border: 1px solid var(--border-color); border-radius: 12px; background: rgba(255,255,255,0.025); }
    .playlist-player-quote { font-size: 1.1rem; line-height: 1.7; white-space: pre-wrap; }
    .playlist-player-meta { margin-top: 12px; color: var(--accent-color); text-align: right; font-size: 0.8rem; }
    .playback-controls { display: flex; gap: 8px; margin-top: 16px; }
    .playback-controls button { flex: 1; }
    .inline-actions { display: flex; gap: 8px; }
    .inline-actions button { flex: 1; }
    .empty-state { padding: 24px 8px; color: var(--text-sub); text-align: center; font-size: 0.9rem; }
    .list-item-meta { margin-top: 5px; color: var(--text-sub); font-size: 0.72rem; }
    @media (min-width: 600px) {
      .screen { max-width: 560px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <button class="playlist-playback-title" id="playlistPlaybackTitle" aria-label="プレイリスト詳細へ戻る"></button>
      <div class="header-actions">
        <button class="icon-btn" id="openPlaylistsBtn" aria-label="プレイリスト一覧" title="プレイリスト">☷</button>
        <button class="icon-btn" id="openMenuBtn" aria-label="設定">⚙︎</button>
        <button class="icon-btn" id="fullscreenBtn" aria-label="全画面表示" title="全画面表示">⛶</button>
        <button class="icon-btn exit-fullscreen-btn" id="exitFullscreenBtn" aria-label="通常画面に戻る" title="通常画面に戻る">✕</button>
      </div>
    </header>

    <main class="card-area" id="cardArea">
      <div class="playlist-membership" id="quotePlaylists" hidden></div>
      <div class="quote-card" id="quoteCard">
        <div class="quote-text" id="quoteText">画面をタップして、言葉を呼び出しましょう。</div>
        <div class="quote-author" id="quoteAuthor"></div>
        <div class="quote-theme" id="quoteTheme"></div>
      </div>
      <div class="tap-hint">Tap to next</div>
    </main>

    <div class="home-actions">
      <button class="icon-btn" id="addToPlaylistBtn" aria-label="表示中の名言をプレイリストに追加" title="プレイリストに追加">＋</button>
      <button class="icon-btn" id="editCurrentQuoteBtn" aria-label="表示中の名言を編集" title="名言を編集" disabled>✎</button>
    </div>
  </div>

  <main class="screen" id="playlistScreen" aria-label="プレイリスト">
    <div class="screen-header">
      <button class="icon-btn" id="playlistBackBtn" aria-label="ホームへ戻る">←</button>
      <h1 id="playlistScreenTitle">PLAYLISTS</h1>
      <button class="icon-btn" id="newPlaylistBtn" aria-label="新しいプレイリスト">＋</button>
    </div>
    <div id="playlistScreenContent"></div>
  </main>

  <!-- ① メニューモーダル -->
  <div class="modal" id="menuModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">MENU</span>
        <button class="icon-btn" onclick="closeModal('menuModal')">✕</button>
      </div>
      <ul class="menu-list">
        <li class="menu-item" onclick="switchModal('menuModal', 'addModal')">名言を追加 <span>→</span></li>
        <li class="menu-item" onclick="switchModal('menuModal', 'listModal')">一覧を見る <span>→</span></li>
        <li class="menu-item" onclick="closeModal('menuModal'); showPlaylists()">プレイリスト <span>→</span></li>
        <li class="menu-item" onclick="switchModal('menuModal', 'settingsModal')">表示設定 <span>→</span></li>
        <li class="menu-item" onclick="switchModal('menuModal', 'backupModal')">バックアップ / 復元 <span>→</span></li>
      </ul>
    </div>
  </div>

  <!-- ② 名言追加モーダル -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">ADD QUOTE</span>
        <button class="icon-btn" onclick="closeModal('addModal')">✕</button>
      </div>
      <div class="form-group">
        <label>言葉・本文</label>
        <textarea id="inputQuote" placeholder="心に残った言葉を入力..."></textarea>
      </div>
      <div class="form-group">
        <label>発言者・出典</label>
        <input type="text" id="inputAuthor" placeholder="例: アインシュタイン">
      </div>
      <div class="form-group">
        <label>テーマ</label>
        <input type="text" id="inputTheme" placeholder="例: 挑戦、人生">
      </div>
      <button class="primary-btn" onclick="addQuote()">保存する</button>
    </div>
  </div>

  <!-- ③ 一覧画面モーダル -->
  <div class="modal" id="listModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">ALL QUOTES</span>
        <button class="icon-btn" onclick="closeModal('listModal')">✕</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="キーワードで検索..." oninput="renderList()">
      <div class="quote-list" id="quoteListContainer"></div>
    </div>
  </div>

  <!-- ④ 管理（バックアップ / 復元）モーダル -->
  <div class="modal" id="backupModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">DATA MANAGEMENT</span>
        <button class="icon-btn" onclick="closeModal('backupModal')">✕</button>
      </div>
      <div class="form-group">
        <label>バックアップ</label>
        <button class="secondary-btn" onclick="exportData()">JSONファイルを書き出す</button>
      </div>
      <hr style="border: none; border-top: 1px solid var(--border-color);">
      <div class="form-group">
        <label>復元</label>
        <input type="file" id="importFile" accept=".json">
        <button class="secondary-btn" onclick="importData()">ファイルから読み込む</button>
      </div>
    </div>
  </div>

  <!-- ⑤ 表示設定モーダル -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">DISPLAY SETTINGS</span>
        <button class="icon-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="form-group">
        <label>表示方向</label>
        <div class="size-selector">
          <button class="size-btn" data-orientation="horizontal" onclick="setOrientation('horizontal')">横書き</button>
          <button class="size-btn" data-orientation="vertical" onclick="setOrientation('vertical')">縦書き</button>
        </div>
      </div>
      <div class="form-group">
        <label for="fontSizeSlider">文字サイズ</label>
        <div class="font-size-control">
          <input id="fontSizeSlider" type="range" min="12" max="48" step="1" value="22" aria-label="名言本文の文字サイズ" oninput="setFontSize(this.value)">
          <output id="fontSizeValue" class="font-size-value" for="fontSizeSlider">22px</output>
        </div>
      </div>
    </div>
  </div>

  <!-- ⑥ 名言編集モーダル -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">EDIT QUOTE</span>
        <button class="icon-btn" onclick="closeEditModal()" aria-label="閉じる">✕</button>
      </div>
      <div class="form-group">
        <label>言葉・本文</label>
        <textarea id="editQuoteText" placeholder="心に残った言葉を入力..."></textarea>
      </div>
      <div class="form-group">
        <label>発言者・出典</label>
        <input type="text" id="editQuoteAuthor" placeholder="例: アインシュタイン">
      </div>
      <div class="form-group">
        <label>テーマ</label>
        <input type="text" id="editQuoteTheme" placeholder="例: 挑戦、人生">
      </div>
      <button class="primary-btn" onclick="saveEdit()">更新する</button>
    </div>
  </div>

  <div class="modal" id="playlistAddModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">ADD TO PLAYLIST</span>
        <button class="icon-btn" onclick="closeModal('playlistAddModal')" aria-label="閉じる">✕</button>
      </div>
      <div id="playlistAddChoices" class="playlist-list"></div>
      <div class="form-group">
        <label for="newPlaylistName">新しいプレイリスト</label>
        <input id="newPlaylistName" type="text" maxlength="60" placeholder="プレイリスト名">
        <button class="secondary-btn" onclick="createPlaylistFromHome()">作成して追加</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'my_quotes_data';
    const PLAYLIST_STORAGE_KEY = 'my_quotes_playlists';
    const FONT_SIZE_KEY = 'quote_font_size';
    const ORIENTATION_KEY = 'quote_orientation';
    const LEGACY_FONT_SIZE_MAP = { small: 16, medium: 22, large: 27, xlarge: 34 };
    let editingId = null;
    let shuffleQueue = [];
    let currentPlaylistId = null;
    let playlistPlayOrder = 'sequential';
    let playlistPlayIndex = 0;
    let currentHomeQuoteId = null;
    let playlistShuffleQueue = [];
    let playlistHistory = [];
    let playlistHistoryCursor = 0;
    let playlistPlaybackActive = false;
    let editReturnContext = 'list';
    let fullscreenControlTimer = null;

    function setFontSize(size) {
      const parsedSize = Number(size);
      const normalizedSize = Number.isFinite(parsedSize)
        ? Math.min(48, Math.max(12, Math.round(parsedSize)))
        : 22;
      localStorage.setItem(FONT_SIZE_KEY, String(normalizedSize));
      document.getElementById('quoteText').style.fontSize = `${normalizedSize}px`;
      document.getElementById('fontSizeSlider').value = normalizedSize;
      document.getElementById('fontSizeValue').textContent = `${normalizedSize}px`;
    }

    function applyFontSize() {
      const savedSize = localStorage.getItem(FONT_SIZE_KEY);
      const size = savedSize === null ? 22 : (LEGACY_FONT_SIZE_MAP[savedSize] || savedSize);
      setFontSize(size);
    }

    function setQuoteText(text) {
      const quoteText = document.getElementById('quoteText');
      const value = String(text);
      const numberPattern = /[0-9０-９]+/g;
      const fragment = document.createDocumentFragment();
      let lastIndex = 0;
      let match;

      while ((match = numberPattern.exec(value)) !== null) {
        fragment.append(document.createTextNode(value.slice(lastIndex, match.index)));
        const number = document.createElement('span');
        number.className = 'tate-chu-yoko';
        number.textContent = match[0];
        fragment.append(number);
        lastIndex = numberPattern.lastIndex;
      }

      fragment.append(document.createTextNode(value.slice(lastIndex)));
      quoteText.replaceChildren(fragment);
    }

    function renderQuotePlaylists() {
      const label = document.getElementById('quotePlaylists');
      const playlists = currentHomeQuoteId === null ? [] : getPlaylists().filter(playlist =>
        playlist.quoteIds.some(id => String(id) === String(currentHomeQuoteId))
      );
      label.hidden = playlists.length === 0;
      label.textContent = playlists.length ? `${playlists[0].name}${playlists.length > 1 ? `　他${playlists.length - 1}` : ''}` : '';
      label.title = playlists.map(playlist => playlist.name).join('、');
    }

    function setOrientation(orientation) {
      const isVertical = orientation === 'vertical';
      localStorage.setItem(ORIENTATION_KEY, isVertical ? 'vertical' : 'horizontal');
      document.getElementById('quoteCard').classList.toggle('is-vertical', isVertical);
      document.querySelectorAll('[data-orientation]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.orientation === (isVertical ? 'vertical' : 'horizontal'));
      });
    }

    function applyOrientation() {
      setOrientation(localStorage.getItem(ORIENTATION_KEY) || 'horizontal');
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getQuotes() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
        { id: 1, text: "準備を怠る者は、失敗を準備しているのだ。", author: "ベンジャミン・フランクリン" },
        { id: 2, text: "小さなことを重ねることが、とんでもないところへ行く唯一の道。", author: "イチロー" }
      ];
    }

    function saveQuotes(quotes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(quotes));
    }

    function getPlaylists() {
      return JSON.parse(localStorage.getItem(PLAYLIST_STORAGE_KEY)) || [];
    }

    function savePlaylists(playlists) {
      localStorage.setItem(PLAYLIST_STORAGE_KEY, JSON.stringify(playlists));
    }

    function makeId() {
      return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function displayRandomQuote() {
      const quotes = getQuotes();
      document.getElementById('quoteCard').scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'auto' });
      if (quotes.length === 0) {
        setQuoteText("言葉が登録されていません。「⚙︎」メニューから追加してください。");
        document.getElementById('quoteAuthor').innerText = "";
        document.getElementById('quoteTheme').innerText = "";
        currentHomeQuoteId = null;
        renderQuotePlaylists();
        updateCurrentQuoteActions();
        return;
      }

      // キューが空になったら全件シャッフルして補充（1件のみなら再シャッフル不要）
      if (shuffleQueue.length === 0) {
        shuffleQueue = shuffleArray(quotes.map((_, i) => i));
        // 直前に表示したものが先頭に来た場合は末尾へ移す
        if (quotes.length > 1) {
          const lastText = document.getElementById('quoteText').innerText;
          if (quotes[shuffleQueue[0]]?.text === lastText) {
            shuffleQueue.push(shuffleQueue.shift());
          }
        }
      }

      const q = quotes[shuffleQueue.shift()];
      
      const card = document.getElementById('quoteCard');
      card.style.opacity = 0;
      setTimeout(() => {
        setQuoteText(q.text);
        document.getElementById('quoteAuthor').innerText = q.author ? `— ${q.author}` : '';
        document.getElementById('quoteTheme').innerText = q.theme ? `# ${q.theme}` : '';
        currentHomeQuoteId = q.id;
        renderQuotePlaylists();
        updateCurrentQuoteActions();
        card.style.opacity = 1;
      }, 150);
    }

    document.getElementById('cardArea').addEventListener('click', () => {
      showFullscreenExitButton();
      if (playlistPlaybackActive) stepPlaylist(1);
      else displayRandomQuote();
    });
    document.getElementById('openMenuBtn').addEventListener('click', () => openModal('menuModal'));
    document.getElementById('openPlaylistsBtn').addEventListener('click', showPlaylists);
    document.getElementById('fullscreenBtn').addEventListener('click', enterFullscreen);
    document.getElementById('exitFullscreenBtn').addEventListener('click', exitFullscreen);
    document.getElementById('playlistBackBtn').addEventListener('click', hidePlaylists);
    document.getElementById('newPlaylistBtn').addEventListener('click', createPlaylistFromScreen);
    document.getElementById('addToPlaylistBtn').addEventListener('click', openPlaylistAddModal);
    document.getElementById('editCurrentQuoteBtn').addEventListener('click', editCurrentQuote);
    document.getElementById('playlistPlaybackTitle').addEventListener('click', returnToPlaylistDetail);
    document.addEventListener('fullscreenchange', syncFullscreenState);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        const app = document.querySelector('.app-container');
        if (document.fullscreenElement === app) document.exitFullscreen();
        app.classList.remove('is-fullscreen');
      }
    });

    function updateCurrentQuoteActions() {
      document.getElementById('editCurrentQuoteBtn').disabled = currentHomeQuoteId === null;
    }

    async function enterFullscreen() {
      const app = document.querySelector('.app-container');
      hideFullscreenExitButton();
      if (app.requestFullscreen) {
        try {
          await app.requestFullscreen();
          return;
        } catch (error) {
          app.classList.add('is-fullscreen');
          return;
        }
      }
      app.classList.add('is-fullscreen');
    }

    async function exitFullscreen() {
      hideFullscreenExitButton();
      if (document.fullscreenElement) await document.exitFullscreen();
      else document.querySelector('.app-container').classList.remove('is-fullscreen');
    }

    function syncFullscreenState() {
      const app = document.querySelector('.app-container');
      const isFullscreen = document.fullscreenElement === app;
      app.classList.toggle('is-fullscreen', isFullscreen);
      if (!isFullscreen) hideFullscreenExitButton();
    }

    function showFullscreenExitButton() {
      const app = document.querySelector('.app-container');
      if (document.fullscreenElement !== app && !app.classList.contains('is-fullscreen')) return;
      clearTimeout(fullscreenControlTimer);
      app.classList.add('show-fullscreen-controls');
      fullscreenControlTimer = setTimeout(hideFullscreenExitButton, 2000);
    }

    function hideFullscreenExitButton() {
      clearTimeout(fullscreenControlTimer);
      fullscreenControlTimer = null;
      document.querySelector('.app-container').classList.remove('show-fullscreen-controls');
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      modal.classList.add('show');
      if (id === 'listModal') {
        document.getElementById('searchInput').value = '';
        renderList();
      }
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('show');
    }

    function switchModal(fromId, toId) {
      closeModal(fromId);
      setTimeout(() => openModal(toId), 200);
    }

    function addQuote() {
      const text = document.getElementById('inputQuote').value.trim();
      const author = document.getElementById('inputAuthor').value.trim();
      const theme = document.getElementById('inputTheme').value.trim();
      if (!text) { alert('言葉を入力してください'); return; }

      const quotes = getQuotes();
      quotes.push({ id: Date.now(), text, author, theme });
      saveQuotes(quotes);

      document.getElementById('inputQuote').value = '';
      document.getElementById('inputAuthor').value = '';
      document.getElementById('inputTheme').value = '';
      closeModal('addModal');
      displayRandomQuote();
    }

    function renderList() {
      const container = document.getElementById('quoteListContainer');
      const keyword = (document.getElementById('searchInput')?.value || '').toLowerCase();
      const all = getQuotes();
      const quotes = keyword
        ? all.filter(q => q.text.toLowerCase().includes(keyword) || (q.author && q.author.toLowerCase().includes(keyword)) || (q.theme && q.theme.toLowerCase().includes(keyword)))
        : all;
      container.innerHTML = '';

      if (quotes.length === 0) {
        container.innerHTML = `<p style="color: var(--text-sub); text-align:center;">${keyword ? '該当する言葉はありません' : '登録された言葉はありません'}</p>`;
        return;
      }

      quotes.forEach(q => {
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div style="flex:1; min-width:0;">
            <div class="list-item-text">${escapeHtml(q.text)}</div>
            ${q.author ? `<div class="list-item-author">— ${escapeHtml(q.author)}</div>` : ''}
            ${q.theme ? `<div class="list-item-meta"># ${escapeHtml(q.theme)}</div>` : ''}
          </div>
          <div style="display:flex; flex-direction:column; gap:6px; flex-shrink:0;">
            <button class="edit-btn" onclick="editQuote(${q.id})">編集</button>
            <button class="delete-btn" onclick="deleteQuote(${q.id})">削除</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function editQuote(id) {
      const q = getQuotes().find(q => q.id === id);
      if (!q) return;
      editingId = id;
      editReturnContext = 'list';
      document.getElementById('editQuoteText').value = q.text;
      document.getElementById('editQuoteAuthor').value = q.author || '';
      document.getElementById('editQuoteTheme').value = q.theme || '';
      switchModal('listModal', 'editModal');
    }

    function editCurrentQuote() {
      const quote = getQuotes().find(item => String(item.id) === String(currentHomeQuoteId));
      if (!quote) return;
      editingId = quote.id;
      editReturnContext = 'home';
      document.getElementById('editQuoteText').value = quote.text;
      document.getElementById('editQuoteAuthor').value = quote.author || '';
      document.getElementById('editQuoteTheme').value = quote.theme || '';
      openModal('editModal');
    }

    function closeEditModal() {
      closeModal('editModal');
      if (editReturnContext === 'list') setTimeout(() => openModal('listModal'), 200);
      editingId = null;
    }

    function saveEdit() {
      const text = document.getElementById('editQuoteText').value.trim();
      const author = document.getElementById('editQuoteAuthor').value.trim();
      const theme = document.getElementById('editQuoteTheme').value.trim();
      if (!text) { alert('言葉を入力してください'); return; }
      let quotes = getQuotes();
      const idx = quotes.findIndex(q => q.id === editingId);
      if (idx !== -1) {
        quotes[idx] = { ...quotes[idx], text, author, theme };
        saveQuotes(quotes);
      }
      if (editReturnContext === 'home') {
        editingId = null;
        closeModal('editModal');
        if (playlistPlaybackActive) {
          renderPlaylistPlaybackQuote();
        } else {
          const updatedQuote = getQuotes().find(q => String(q.id) === String(currentHomeQuoteId));
          if (updatedQuote) {
            setQuoteText(updatedQuote.text);
            document.getElementById('quoteAuthor').textContent = updatedQuote.author ? `— ${updatedQuote.author}` : '';
            document.getElementById('quoteTheme').textContent = updatedQuote.theme ? `# ${updatedQuote.theme}` : '';
            renderQuotePlaylists();
          }
        }
        return;
      }
      editingId = null;
      displayRandomQuote();
      switchModal('editModal', 'listModal');
    }

    function deleteQuote(id) {
      if (!confirm('本当に削除しますか？')) return;
      let quotes = getQuotes();
      quotes = quotes.filter(q => q.id !== id);
      saveQuotes(quotes);
      savePlaylists(getPlaylists().map(playlist => ({ ...playlist, quoteIds: playlist.quoteIds.filter(quoteId => quoteId !== id) })));
      renderList();
      displayRandomQuote();
    }

    function exportData() {
      try {
        const backup = { quotes: getQuotes(), playlists: getPlaylists() };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.href = url;
        downloadAnchor.download = `meigen_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (error) {
        alert('バックアップを書き出せませんでした。ブラウザーの保存領域を確認してください。');
        console.error('Backup export failed:', error);
      }
    }

    function importData() {
      const fileInput = document.getElementById('importFile');
      if (!fileInput.files.length) { alert('JSONファイルを選択してください'); return; }

      const reader = new FileReader();
      reader.onload = function(e) {
        let importedQuotes;
        let importedPlaylists;
        try {
          const importedData = JSON.parse(e.target.result);
          importedQuotes = Array.isArray(importedData) ? importedData : importedData?.quotes;
          importedPlaylists = Array.isArray(importedData) ? [] : (importedData?.playlists ?? []);
          if (!Array.isArray(importedQuotes) || !Array.isArray(importedPlaylists) ||
              !importedQuotes.every(quote => quote && typeof quote.text === 'string') ||
              !importedPlaylists.every(playlist => playlist && typeof playlist.name === 'string' && Array.isArray(playlist.quoteIds))) {
            throw new Error('invalid-backup');
          }
        } catch (error) {
          alert('バックアップファイルを読み取れません。JSON形式とファイルの内容を確認してください。');
          console.error('Backup validation failed:', error);
          return;
        }

        try {
          if (confirm('既存のデータに上書き復元しますか？（キャンセルで追加登録）')) {
            saveQuotes(importedQuotes);
            savePlaylists(importedPlaylists);
          } else {
            const current = getQuotes();
            saveQuotes([...current, ...importedQuotes]);
            const currentPlaylists = getPlaylists();
            savePlaylists([...currentPlaylists, ...importedPlaylists.map(playlist => ({ ...playlist, id: makeId() }))]);
          }
          alert('データの復元が完了しました');
          closeModal('backupModal');
          displayRandomQuote();
        } catch (error) {
          alert('復元データを保存できませんでした。端末の空き容量を確認してください。');
          console.error('Backup restore failed:', error);
        }
      };
      reader.onerror = function() {
        alert('ファイルを読み込めませんでした。別のファイルを選択してください。');
      };
      reader.readAsText(fileInput.files[0]);
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function showPlaylists() {
      playlistPlaybackActive = false;
      document.querySelector('.app-container').style.display = 'none';
      document.getElementById('playlistScreen').classList.add('active');
      currentPlaylistId = null;
      renderPlaylists();
    }

    function hidePlaylists() {
      document.getElementById('playlistScreen').classList.remove('active');
      document.querySelector('.app-container').style.display = '';
      currentPlaylistId = null;
      playlistPlaybackActive = false;
      document.getElementById('playlistPlaybackTitle').classList.remove('is-visible');
    }

    function renderPlaylists() {
      const content = document.getElementById('playlistScreenContent');
      const title = document.getElementById('playlistScreenTitle');
      const playlists = getPlaylists();
      if (currentPlaylistId === null) {
        title.textContent = 'PLAYLISTS';
        content.innerHTML = '';
        if (!playlists.length) {
          content.innerHTML = '<p class="empty-state">プレイリストはまだありません。</p>';
          return;
        }
        const list = document.createElement('div');
        list.className = 'playlist-list';
        playlists.forEach(playlist => {
          const row = document.createElement('div');
          row.className = 'playlist-row';
          row.innerHTML = `<button class="playlist-open" onclick="openPlaylist('${escapeHtml(String(playlist.id))}')"><span class="playlist-name">${escapeHtml(playlist.name)}</span><span class="playlist-count">${playlist.quoteIds.length} 件</span></button><div class="playlist-controls"><button class="edit-btn" onclick="renamePlaylist('${escapeHtml(String(playlist.id))}')" aria-label="名前を変更">編集</button><button class="delete-btn" onclick="deletePlaylist('${escapeHtml(String(playlist.id))}')" aria-label="プレイリストを削除">削除</button></div>`;
          list.appendChild(row);
        });
        content.appendChild(list);
        return;
      }

      const playlist = playlists.find(item => String(item.id) === String(currentPlaylistId));
      if (!playlist) { currentPlaylistId = null; renderPlaylists(); return; }
      title.textContent = playlist.name;
      const quotes = playlist.quoteIds.map(id => getQuotes().find(quote => String(quote.id) === String(id))).filter(Boolean);
      content.innerHTML = `<section class="playlist-detail"><div class="size-selector"><button class="size-btn ${playlistPlayOrder === 'sequential' ? 'active' : ''}" onclick="setPlaylistOrder('sequential')">順番</button><button class="size-btn ${playlistPlayOrder === 'random' ? 'active' : ''}" onclick="setPlaylistOrder('random')">ランダム</button></div><button class="primary-btn" onclick="startPlaylistPlayback()" ${quotes.length ? '' : 'disabled'}>再生</button><div class="inline-actions"><button class="secondary-btn" onclick="renderPlaylistLibrary()">名言を追加</button></div>${quotes.length ? '' : '<p class="empty-state">このプレイリストには名言がありません。</p>'}<div id="playlistQuoteItems" class="quote-list"></div><div id="playlistQuoteLibrary" class="quote-list"></div></section>`;
      const items = document.getElementById('playlistQuoteItems');
      quotes.forEach((quote, index) => {
        const row = document.createElement('div');
        row.className = 'list-item';
        row.innerHTML = `<div style="flex:1; min-width:0;"><div class="list-item-text">${escapeHtml(quote.text)}</div>${quote.author ? `<div class="list-item-author">— ${escapeHtml(quote.author)}</div>` : ''}${quote.theme ? `<div class="list-item-meta"># ${escapeHtml(quote.theme)}</div>` : ''}</div><div class="playlist-controls"><button class="edit-btn" onclick="movePlaylistQuote(${index}, -1)" aria-label="上へ" ${index === 0 ? 'disabled' : ''}>↑</button><button class="edit-btn" onclick="movePlaylistQuote(${index}, 1)" aria-label="下へ" ${index === quotes.length - 1 ? 'disabled' : ''}>↓</button><button class="delete-btn" onclick="removeQuoteFromPlaylist('${escapeHtml(String(quote.id))}')" aria-label="リストから外す">外す</button></div>`;
        items.appendChild(row);
      });
    }

    function createPlaylistFromScreen() {
      const name = prompt('プレイリスト名を入力してください');
      if (name === null) return;
      const trimmedName = name.trim();
      if (!trimmedName) { alert('プレイリスト名を入力してください'); return; }
      const playlists = getPlaylists();
      playlists.push({ id: makeId(), name: trimmedName, quoteIds: [] });
      savePlaylists(playlists);
      renderPlaylists();
    }

    function createPlaylistFromHome() {
      const nameInput = document.getElementById('newPlaylistName');
      const name = nameInput.value.trim();
      if (!name) { alert('プレイリスト名を入力してください'); return; }
      const playlists = getPlaylists();
      const playlist = { id: makeId(), name, quoteIds: currentHomeQuoteId === null ? [] : [currentHomeQuoteId] };
      playlists.push(playlist);
      savePlaylists(playlists);
      renderQuotePlaylists();
      nameInput.value = '';
      closeModal('playlistAddModal');
    }

    function renderPlaylistAddChoices() {
      const choices = document.getElementById('playlistAddChoices');
      const playlists = getPlaylists();
      choices.innerHTML = '';
      if (!playlists.length) choices.innerHTML = '<p class="empty-state">プレイリストはありません。下から作成できます。</p>';
      playlists.forEach(playlist => {
        const isSelected = playlist.quoteIds.some(id => String(id) === String(currentHomeQuoteId));
        const button = document.createElement('button');
        button.className = `secondary-btn playlist-choice-btn${isSelected ? ' is-selected' : ''}`;
        button.textContent = playlist.name;
        button.setAttribute('aria-pressed', String(isSelected));
        button.onclick = () => toggleQuoteInPlaylist(playlist.id);
        choices.appendChild(button);
      });
    }

    function openPlaylistAddModal() {
      if (currentHomeQuoteId === null) { alert('先に名言を表示してください'); return; }
      renderPlaylistAddChoices();
      openModal('playlistAddModal');
    }

    function toggleQuoteInPlaylist(playlistId) {
      const playlists = getPlaylists();
      const playlist = playlists.find(item => String(item.id) === String(playlistId));
      if (!playlist || currentHomeQuoteId === null) return;
      const quoteIndex = playlist.quoteIds.findIndex(id => String(id) === String(currentHomeQuoteId));
      if (quoteIndex === -1) playlist.quoteIds.push(currentHomeQuoteId);
      else playlist.quoteIds.splice(quoteIndex, 1);
      savePlaylists(playlists);
      renderQuotePlaylists();
      renderPlaylistAddChoices();
    }

    function addQuoteToPlaylist(playlistId, quoteId) {
      const playlists = getPlaylists();
      const playlist = playlists.find(item => String(item.id) === String(playlistId));
      if (!playlist) return;
      if (playlist.quoteIds.some(id => String(id) === String(quoteId))) { alert('この名言は追加済みです'); return; }
      playlist.quoteIds.push(quoteId);
      savePlaylists(playlists);
      renderQuotePlaylists();
      closeModal('playlistAddModal');
      if (document.getElementById('playlistScreen').classList.contains('active')) renderPlaylists();
    }

    function openPlaylist(playlistId) {
      currentPlaylistId = playlistId;
      playlistPlayIndex = 0;
      playlistShuffleQueue = [];
      playlistHistory = [0];
      playlistHistoryCursor = 0;
      renderPlaylists();
    }

    function startPlaylistPlayback() {
      const playlist = getPlaylists().find(item => String(item.id) === String(currentPlaylistId));
      if (!playlist || !playlist.quoteIds.length) return;
      playlistPlayIndex = 0;
      playlistShuffleQueue = [];
      playlistHistory = [0];
      playlistHistoryCursor = 0;
      playlistPlaybackActive = true;
      const title = document.getElementById('playlistPlaybackTitle');
      title.textContent = playlist.name;
      title.setAttribute('aria-label', `${playlist.name}、詳細へ戻る`);
      title.classList.add('is-visible');
      document.getElementById('playlistScreen').classList.remove('active');
      document.querySelector('.app-container').style.display = '';
      renderPlaylistPlaybackQuote();
    }

    function returnToPlaylistDetail() {
      playlistPlaybackActive = false;
      document.querySelector('.app-container').style.display = 'none';
      document.getElementById('playlistScreen').classList.add('active');
      document.getElementById('playlistPlaybackTitle').classList.remove('is-visible');
      renderPlaylists();
    }

    function renderPlaylistPlaybackQuote() {
      const playlist = getPlaylists().find(item => String(item.id) === String(currentPlaylistId));
      const quote = playlist?.quoteIds.map(id => getQuotes().find(item => String(item.id) === String(id))).filter(Boolean)[playlistPlayIndex];
      if (!quote) return;
      setQuoteText(quote.text);
      document.getElementById('quoteAuthor').textContent = quote.author ? `— ${quote.author}` : '';
      document.getElementById('quoteTheme').textContent = quote.theme ? `# ${quote.theme}` : '';
      currentHomeQuoteId = quote.id;
      renderQuotePlaylists();
      updateCurrentQuoteActions();
      document.getElementById('quoteCard').scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function renamePlaylist(playlistId) {
      const playlists = getPlaylists();
      const playlist = playlists.find(item => String(item.id) === String(playlistId));
      if (!playlist) return;
      const name = prompt('プレイリスト名を入力してください', playlist.name);
      if (name === null) return;
      if (!name.trim()) { alert('プレイリスト名を入力してください'); return; }
      playlist.name = name.trim();
      savePlaylists(playlists);
      renderQuotePlaylists();
      renderPlaylists();
    }

    function deletePlaylist(playlistId) {
      if (!confirm('プレイリストを削除しますか？名言自体は削除されません。')) return;
      savePlaylists(getPlaylists().filter(item => String(item.id) !== String(playlistId)));
      renderQuotePlaylists();
      renderPlaylists();
    }

    function removeQuoteFromPlaylist(quoteId) {
      const playlists = getPlaylists();
      const playlist = playlists.find(item => String(item.id) === String(currentPlaylistId));
      if (!playlist) return;
      playlist.quoteIds = playlist.quoteIds.filter(id => String(id) !== String(quoteId));
      savePlaylists(playlists);
      renderQuotePlaylists();
      playlistPlayIndex = Math.min(playlistPlayIndex, Math.max(playlist.quoteIds.length - 1, 0));
      playlistHistory = playlist.quoteIds.length ? [playlistPlayIndex] : [];
      playlistHistoryCursor = 0;
      renderPlaylists();
    }

    function movePlaylistQuote(index, direction) {
      const playlists = getPlaylists();
      const playlist = playlists.find(item => String(item.id) === String(currentPlaylistId));
      const nextIndex = index + direction;
      if (!playlist || nextIndex < 0 || nextIndex >= playlist.quoteIds.length) return;
      [playlist.quoteIds[index], playlist.quoteIds[nextIndex]] = [playlist.quoteIds[nextIndex], playlist.quoteIds[index]];
      savePlaylists(playlists);
      playlistPlayIndex = nextIndex;
      playlistHistory = [playlistPlayIndex];
      playlistHistoryCursor = 0;
      renderPlaylists();
    }

    function setPlaylistOrder(order) {
      playlistPlayOrder = order;
      playlistShuffleQueue = [];
      playlistHistory = [playlistPlayIndex];
      playlistHistoryCursor = 0;
      renderPlaylists();
    }

    function stepPlaylist(direction) {
      const playlist = getPlaylists().find(item => String(item.id) === String(currentPlaylistId));
      if (!playlist || !playlist.quoteIds.length) return;
      if (playlistPlayOrder === 'sequential') {
        playlistPlayIndex = Math.max(0, Math.min(playlistPlayIndex + direction, playlist.quoteIds.length - 1));
      } else {
        if (direction < 0 && playlistHistoryCursor > 0) {
          playlistHistoryCursor -= 1;
          playlistPlayIndex = playlistHistory[playlistHistoryCursor];
        } else if (direction > 0 && playlistHistoryCursor < playlistHistory.length - 1) {
          playlistHistoryCursor += 1;
          playlistPlayIndex = playlistHistory[playlistHistoryCursor];
        } else if (direction > 0) {
          if (!playlistShuffleQueue.length) {
            playlistShuffleQueue = shuffleArray(Array.from({ length: playlist.quoteIds.length }, (_, index) => index));
            if (playlistShuffleQueue.length > 1 && playlistShuffleQueue[0] === playlistPlayIndex) playlistShuffleQueue.push(playlistShuffleQueue.shift());
          }
          playlistPlayIndex = playlistShuffleQueue.shift();
          playlistHistory = playlistHistory.slice(0, playlistHistoryCursor + 1);
          playlistHistory.push(playlistPlayIndex);
          playlistHistoryCursor += 1;
        }
      }
      if (playlistPlaybackActive) renderPlaylistPlaybackQuote();
      else renderPlaylists();
    }

    function renderPlaylistLibrary() {
      const library = document.getElementById('playlistQuoteLibrary');
      const playlist = getPlaylists().find(item => String(item.id) === String(currentPlaylistId));
      if (!playlist || !library) return;
      library.innerHTML = '<h2 class="modal-title">名言を選択</h2>';
      getQuotes().filter(quote => !playlist.quoteIds.some(id => String(id) === String(quote.id))).forEach(quote => {
        const button = document.createElement('button');
        button.className = 'list-item';
        button.style.width = '100%';
        button.style.textAlign = 'left';
        button.innerHTML = `<span class="list-item-text">${escapeHtml(quote.text)}${quote.author ? `<span class="list-item-author" style="display:block">— ${escapeHtml(quote.author)}</span>` : ''}${quote.theme ? `<span class="list-item-meta" style="display:block"># ${escapeHtml(quote.theme)}</span>` : ''}</span><span class="edit-btn">追加</span>`;
        button.onclick = () => addQuoteToPlaylist(currentPlaylistId, quote.id);
        library.appendChild(button);
      });
      if (!library.children.length || library.children.length === 1) library.innerHTML += '<p class="empty-state">追加できる名言はありません。</p>';
    }

    displayRandomQuote();
    applyFontSize();
    applyOrientation();
  </script>
